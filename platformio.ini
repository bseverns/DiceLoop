[platformio]
default_envs = teensy40
src_dir = src
include_dir = include
test_dir = tests/native

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 9600
extra_scripts =
  pre:scripts/disable_audio_adc.py
build_flags =
  -D USB_AUDIO
  -D AUDIO_BLOCK_SAMPLES=128
  -Iinclude
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.11

[env:native]
platform = native
framework =
build_flags =
  -std=c++17
  -I tests/native/stubs
  -D DICELOOP_ENABLE_OLED=0
build_src_filter =
  +<*>
  -<main.cpp>
test_build_src = yes
