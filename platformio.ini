[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 9600
extra_scripts =
  scripts/disable_audio_adc.py
build_flags =
  -D USB_AUDIO
  -D AUDIO_BLOCK_SAMPLES=128
  -Iinclude
  -include Arduino.h
; The Teensyduino toolchain already ships the Audio library, so we only list
; external deps here. Pulling it again from the registry drags in a Kinetis-only
; build that breaks Teensy 4.x.
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.11
